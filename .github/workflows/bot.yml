name: Run Telegram Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/30 * * * *' # Запуск каждые 30 минут, чтобы бот не засыпал
  workflow_dispatch:

jobs:
  run-bot:
  
    runs-on: ubuntu-latest

    steps:
    # Обновлено до v4, чтобы работать на свежем Node.js
    - name: Checkout repository
      uses: actions/checkout@v4

    # Обновлено до v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot

    - name: Run Bot
      run: |
        python bot.py
